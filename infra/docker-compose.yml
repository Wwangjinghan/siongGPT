services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: siong-postgres

    environment:
      POSTGRES_DB: siong_gpt
      POSTGRES_USER: siong_admin
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siong_admin -d siong_gpt"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
